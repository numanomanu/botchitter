<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="hitokoto" />
  <meta name="theme-color" content="#F7F7F4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
  <title>hitokoto — 一人Twitter</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="viewport">

  <!-- ヘッダー -->
  <header>
    <div class="header-left">
      <button class="btn-back" id="btnBack" onclick="goHome()" title="タイムラインに戻る">
        <svg viewBox="0 0 24 24">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <div class="logo" onclick="goHome()">hitokoto</div>
    </div>

    <div class="header-right">
      <div class="header-date" id="todayDateLabel">9月30日 水曜日</div>
      <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="テーマ切り替え">
        <!-- SVGはapp.jsから動的制御 -->
      </button>
    </div>
  </header>

  <!-- 1. メインタイムライン画面 -->
  <div class="view-timeline" id="viewTimeline">

    <!-- 投稿フォーム -->
    <section class="composer">
      <textarea
        id="composerInput"
        class="composer-textarea"
        placeholder="今日、何が見えた？"
        rows="2"
        oninput="handleInput()"
      ></textarea>

      <!-- 引用中のポスト・コメントプレビュー -->
      <div class="quote-preview" id="quotePreview">
        <div class="quote-preview-header">
          <span id="quotePreviewLabel">引用中</span>
          <button class="btn-cancel-quote" onclick="clearQuote()" title="引用を解除">✕</button>
        </div>
        <div class="quote-preview-body" id="quotePreviewText"></div>
      </div>

      <div class="composer-bottom">
        <button id="postBtn" class="btn-post" disabled onclick="publishTweet()">
          残す
        </button>
      </div>
    </section>

    <!-- タイムライン -->
    <main class="timeline" id="timelineStream">
      <!-- app.js でレンダリング -->
    </main>

  </div>

  <!-- 2. ポスト詳細画面（Thread & Connections View） -->
  <div class="view-detail" id="viewDetail">
    <div id="detailContent">
      <!-- app.js でレンダリング -->
    </div>
  </div>

  <!-- 削除確認モーダル -->
  <div class="confirm-overlay" id="confirmOverlay" onclick="closeConfirm()">
    <div class="confirm-dialog" onclick="event.stopPropagation()">
      <div class="confirm-title" id="confirmTitle">この記録を削除しますか？</div>
      <div class="confirm-actions">
        <button class="btn-confirm-cancel" onclick="closeConfirm()">キャンセル</button>
        <button class="btn-confirm-danger" id="btnConfirmDelete">削除する</button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="toast"></div>

</div>

<!-- 定数・シードデータ & アプリケーションロジック -->
<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
