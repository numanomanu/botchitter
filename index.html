<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="botchitter" />
  <meta name="theme-color" content="#F7F7F4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
  <title>botchitter — 一人Twitter</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- 文言はすべて app.js の I18N から入る -->
<div class="viewport">

  <!-- ヘッダー -->
  <header>
    <div class="header-left">
      <button class="btn-back" id="btnBack" onclick="goHome()" aria-label="Back">
        <svg viewBox="0 0 24 24">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <div class="logo" onclick="goHome()">
        <svg class="logo-mark" viewBox="0 0 247 286" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M122.278 10.0027C83.7788 100.003 193.553 68.5032 226.278 128.003C259.003 187.503 209.777 264.002 131.277 264.002C65.8923 264.002 -8.72243 229.503 28.7773 128.003" stroke="currentColor" stroke-width="20" stroke-linecap="round"/>
          <path d="M105.278 192.003C105.278 202.772 100.467 205.003 92.5722 205.003C84.6778 205.003 78.2781 196.272 78.2781 185.503C78.2781 174.733 84.6778 166.003 92.5722 166.003C100.467 166.003 105.278 181.233 105.278 192.003Z" fill="currentColor"/>
          <path d="M179.322 158.653C181.507 165.328 179.415 173.221 174.649 176.281C169.883 179.341 164.249 176.41 162.064 169.734C159.879 163.058 160.135 149.554 164.901 146.494C169.667 143.434 177.138 151.977 179.322 158.653Z" fill="currentColor"/>
          <path d="M6.40486 283.503C-19.4685 295.003 41.4046 244.003 41.4046 244.003L107.778 267.003C107.778 267.003 32.2783 272.003 6.40486 283.503Z" fill="currentColor"/>
        </svg>
        <span>botchitter</span>
      </div>
    </div>

    <div class="header-right">
      <button class="header-icon-btn" id="btnSearch" onclick="toggleSearch()" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      </button>
      <button class="header-date" id="todayDateLabel" onclick="openArchive()"></button>
      <button class="header-icon-btn" onclick="openMenu()" aria-label="Menu">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
      </button>
    </div>
  </header>

  <!-- 1. メインタイムライン画面 -->
  <div class="view-timeline" id="viewTimeline">

    <!-- 検索バー（ヘッダーの虫眼鏡または Cmd+K で表示） -->
    <div class="search-bar" id="searchBar">
      <div class="search-input-wrapper">
        <svg class="search-input-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input type="text" id="searchInput" class="search-input" oninput="handleSearchInput(this.value)" onkeydown="handleSearchKeydown(event)" oncompositionstart="handleSearchCompositionStart()" oncompositionend="handleSearchCompositionEnd()" autocomplete="off" />
        <button class="btn-clear-search" id="btnClearSearch" onclick="clearSearch()" aria-label="Clear">✕</button>
      </div>
    </div>

    <!-- iOS Safari のタブで開いた時だけ表示 -->
    <div class="install-hint" id="installHint">
      <span id="installHintText"></span>
      <button class="btn-cancel-quote" onclick="dismissInstallHint()" aria-label="Close">✕</button>
    </div>

    <!-- 絞り込み中の条件（月・タグ・検索。#month-<YYYY-MM>&tag-<tag>&q-<query>） -->
    <div class="filter-bar" id="filterBar"></div>

    <!-- 投稿フォーム -->
    <section class="composer">
      <div class="highlight-field">
        <div class="highlight-backdrop" aria-hidden="true"></div>
        <textarea
          id="composerInput"
          class="composer-textarea"
          rows="2"
          oninput="handleInput()"
          onkeydown="submitOnCmdEnter(event, publishTweet)"
        ></textarea>
      </div>

      <!-- 引用プレビュー -->
      <div class="quote-preview" id="quotePreview">
        <div class="quote-preview-header">
          <div class="quote-preview-meta">
            <svg class="quote-preview-icon" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            <span id="quotePreviewDate"></span>
          </div>
          <button class="btn-cancel-quote" onclick="clearQuote()" aria-label="Close">✕</button>
        </div>
        <div class="quote-preview-body" id="quotePreviewText"></div>
      </div>

      <div class="composer-bottom">
        <!-- 気分（任意。顔のボタン → 5つの顔。app.js が描く） -->
        <div id="composerMoodSlot"></div>
        <button id="postBtn" class="btn-post" disabled onclick="publishTweet()"></button>
      </div>
    </section>

    <!-- タイムライン -->
    <main class="timeline" id="timelineStream"></main>

  </div>

  <!-- 2. ポスト詳細画面（#tweet-<id>） -->
  <div class="view-detail" id="viewDetail">
    <div id="detailContent"></div>
  </div>

  <!-- 3. 振り返り（#archive。草） -->
  <div class="view-archive" id="viewArchive">
    <div id="archiveContent"></div>
  </div>

  <!-- 削除確認モーダル -->
  <div class="confirm-overlay" id="confirmOverlay" onclick="closeConfirm()">
    <div class="confirm-dialog" onclick="event.stopPropagation()">
      <div class="confirm-title" id="confirmTitle"></div>
      <div class="confirm-actions">
        <button class="btn-confirm-cancel" id="btnConfirmCancel" onclick="closeConfirm()"></button>
        <button class="btn-confirm-danger" id="btnConfirmDelete" onclick="runConfirm()"></button>
      </div>
    </div>
  </div>

  <!-- メニュー（タグ一覧・振り返り・テーマ・バックアップの書き出し／読み込み） -->
  <div class="confirm-overlay" id="menuOverlay" onclick="closeMenu()">
    <div class="confirm-dialog menu-dialog" onclick="event.stopPropagation()">
      <div class="tag-list" id="tagList"></div>
      <button class="menu-item" id="btnArchive" onclick="openArchive()"></button>
      <button class="menu-item" id="btnRandom" onclick="openRandomTweet()"></button>
      <button class="menu-item" id="btnTheme" onclick="toggleTheme()"></button>
      <button class="menu-item" id="btnExport" onclick="exportData()"></button>
      <label class="menu-item" id="btnImport" for="importInput"></label>
      <input type="file" id="importInput" class="visually-hidden" accept=".json,application/json" onchange="importData(this)" />
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="toast"></div>

</div>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>

</body>
</html>
